[package]
name = "rust-bar"
version = "0.1.0"
edition = "2021"

[dependencies]
crossterm = "0.28.1"
hyprland = { git = "https://github.com/hyprland-community/hyprland-rs", version = "0.4.0-beta.1" }
rusttype = "0.9.3"
softbuffer = "0.4.6"
winit = { version = "0.30.5", features = ["ahash", "bytemuck", "memmap2", "percent-encoding", "rwh_05", "sctk-adwaita", "wayland", "wayland-backend", "wayland-client", "wayland-csd-adwaita", "wayland-protocols", "wayland-protocols-plasma", "x11", "x11-dl", "x11rb"] }
