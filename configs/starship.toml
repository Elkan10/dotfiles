format = "[](bright-black)$os[](bg:red fg:bright-black)$hostname[](bg:white fg:red)$nix_shell[](bg:blue fg:white)$directory[](fg:blue bg:red)$git_branch$git_status[](fg:red bg:cyan)$c$rust$golang$nodejs$php$java$kotlin$haskell$python[](fg:cyan bg:purple)$time[ ](fg:purple)$line_break$character"
palette = "base16"

[hostname]
ssh_only = true
disabled = false
style = "bg:red"
format = "[ 󰖟 $hostname ]($style)"

[nix_shell]
disabled = false
style = "bg:white fg:bright-black"
format = "[ 󰜗 $name ]($style)"

[c]
format = "[[ $symbol( $version) ](fg:black bg:cyan)]($style)"
style = "bg:cyan"
symbol = " "

[character]
disabled = false
error_symbol = "[](bold fg:red)"
success_symbol = "[](bold fg:green)"

[directory]
format = "[ $path ]($style)"
style = "fg:black bg:blue"
truncation_length = 3
truncation_symbol = "../"

[directory.substitutions]
Developer = "󰲋 "
Documents = "󰈙 "
Downloads = " "
Music = "󰝚 "
Pictures = " "

[git_branch]
format = "[[ $symbol $branch ](fg:black bg:red)]($style)"
style = "bg:cyan"
symbol = ""

[git_status]
format = "[[($all_status$ahead_behind )](fg:black bg:red)]($style)"
style = "bg:cyan"

[golang]
format = "[[ $symbol( $version) ](fg:black bg:cyan)]($style)"
style = "bg:cyan"
symbol = ""

[haskell]
format = "[[ $symbol( $version) ](fg:black bg:cyan)]($style)"
style = "bg:cyan"
symbol = ""

[java]
format = "[[ $symbol( $version) ](fg:black bg:cyan)]($style)"
style = "bg:cyan"
symbol = " "

[kotlin]
format = "[[ $symbol( $version) ](fg:black bg:cyan)]($style)"
style = "bg:cyan"
symbol = ""

[line_break]
disabled = false

[nodejs]
format = "[[ $symbol( $version) ](fg:black bg:cyan)]($style)"
style = "bg:cyan"
symbol = ""

[os]
disabled = false
style = "bg:bright-black fg:white"

[os.symbols]
