$fileManager=yazi
$mainMod=SUPER
$menu=rofi -show drun
$terminal=alacritty
animations {
  bezier=myBezier, 0.05, 0.9, 0.1, 1.05
  animation=windows, 1, 7, myBezier
  animation=windowsOut, 1, 7, default, popin 80%
  animation=border, 1, 10, default
  animation=borderangle, 1, 8, default
  animation=fade, 1, 7, default
  animation=workspaces, 1, 6, default
  enabled=true
}

cursor {
  no_hardware_cursors=true
}

decoration {
  blur {
    enabled=true
    passes=1
    size=3
    vibrancy=0.169600
  }

  shadow {
    color=rgba(2e344099)
  }
  active_opacity=1.000000
  inactive_opacity=1.000000
  rounding=10
}

dwindle {
  preserve_split=true
  pseudotile=true
}

general {
  allow_tearing=false
  border_size=2
  col.active_border=rgba(33ccffee) rgba(00ff99ee) 45deg
  col.inactive_border=rgba(595959aa)
  gaps_in=5
  gaps_out=20
  layout=dwindle
  resize_on_border=false
}

group {
  groupbar {
    col.active=rgb(5c81c8)
    col.inactive=rgb(485259)
    text_color=rgb(d7dbe3)
  }
  col.border_active=rgb(5c81c8)
  col.border_inactive=rgb(485259)
  col.border_locked_active=rgb(5c81ad)
}

input {
  touchpad {
    natural_scroll=false
  }
  follow_mouse=1
  kb_layout=se
  sensitivity=0
}

master {
  new_status=master
}

misc {
  background_color=rgb(2e3440)
  disable_hyprland_logo=true
  force_default_wallpaper=-1
}
bind=$mainMod, Q, exec, $terminal
bind=$mainMod, C, killactive
bind=$mainMod, M, exit
bind=$mainMod, E, exec, $fileManager
bind=$mainMod, V, togglefloating
bind=$mainMod, F, fullscreen, 0
bind=$mainMod, R, exec, $menu
bind=$mainMod, S, exec, hyprshot -m region
bind=$mainMod CTRL, L, exec, hyprlock
bind=$mainMod, h, movefocus, l
bind=$mainMod, l, movefocus, r
bind=$mainMod, k, movefocus, u
bind=$mainMod, j, movefocus, d
bind=$mainMod SHIFT, h, swapwindow, l
bind=$mainMod SHIFT, l, swapwindow, r
bind=$mainMod SHIFT, k, swapwindow, u
bind=$mainMod SHIFT, j, swapwindow, d
bind= $mainMod SHIFT, 1, movetoworkspace, 1
bind= $mainMod SHIFT, 2, movetoworkspace, 2
bind= $mainMod SHIFT, 3, movetoworkspace, 3
bind= $mainMod SHIFT, 4, movetoworkspace, 4
bind= $mainMod SHIFT, 5, movetoworkspace, 5
bind= $mainMod, 1, workspace, 1
bind= $mainMod, 2, workspace, 2
bind= $mainMod, 3, workspace, 3
bind= $mainMod, 4, workspace, 4
bind= $mainMod, 5, workspace, 5
bindm=$mainMod, mouse:272, movewindow
bindm=$mainMod, mouse:273, resizewindow
env=XCURSOR_SIZE, 24
env=HYPRCURSOR_SIZE, 24
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once=$terminal
exec-once=waybar &
exec-once=awww-daemon &
exec-once=awww restore
exec-once=nm-applet &
exec-once=fcitx5 -d &
monitor=DP-1, 2560x1440@240, 0x0, 1
monitor=HDMI-A-1, 1920x1080@120, auto-left, 1
windowrule {
  name = suppress-max
  suppress_event = maximize
  match:class = .*
}
workspace=1, monitor:DP-1, default:true
workspace=2, monitor:DP-1
workspace=3, monitor:DP-1
workspace=4, monitor:HDMI-A-1, default:true
workspace=5, monitor:HDMI-A-1
